version: '3.9'

# Development overrides - enables hot reload and debug ports
services:
  api-gateway:
    build:
      target: development
    command: npm run dev
    volumes:
      - ./gateway:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
      - "9229:9229"   # Node.js debugger

  user-service:
    build:
      target: development
    command: npm run dev
    volumes:
      - ./services/user:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"
      - "9230:9229"

  product-service:
    command: npm run dev
    volumes:
      - ./services/product:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3002:3002"
      - "9231:9229"

  cart-service:
    command: npm run dev
    volumes:
      - ./services/cart:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3003:3003"

  order-service:
    command: npm run dev
    volumes:
      - ./services/order:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3004:3004"

  payment-service:
    command: npm run dev
    volumes:
      - ./services/payment:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3005:3005"

  notification-service:
    command: npm run dev
    volumes:
      - ./services/notification:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "3006:3006"

  # Mongo Express UI for development
  mongo-express:
    image: mongo-express:1.0.0
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongo:27017/
    ports:
      - "8081:8081"
    networks:
      - backend
    depends_on:
      - mongo

  # Redis Commander UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redispass}
    ports:
      - "8082:8081"
    networks:
      - backend
    depends_on:
      - redis
